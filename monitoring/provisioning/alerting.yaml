# Grafana alert rules, contact point and notification policy, provisioned at start-up (compose.yaml). Locally the
# alerts are emailed to Mailpit (http://localhost:8025). Thresholds are starting points to tune with real traffic.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: appointments-team
    receivers:
      - uid: appointments-team-email
        type: email
        settings:
          addresses: ops@appointments.test
          singleEmail: true

policies:
  - orgId: 1
    receiver: appointments-team
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: appointments
    folder: Appointments
    interval: 1m
    rules:
      # --- RED: is the service answering, correctly and fast enough? ---------------------------------------------------
      - uid: appointments-backend-down
        title: Backend sends no metrics
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum(count_over_time(process_cpu_usage{service_name="appointments"}[2m])) or vector(0)' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: lt, params: [ 1 ] } } ] }
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: The backend has not reported for 2 minutes. It is down, or cannot reach the collector.

      - uid: appointments-error-rate
        title: Server errors above 2%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (sum(rate(http_server_requests_milliseconds_count{service_name="appointments",status=~"5.."}[5m])) or vector(0))
                / (sum(rate(http_server_requests_milliseconds_count{service_name="appointments"}[5m])) > 0)
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 0.02 ] } } ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: More than 2% of requests end in a 5xx. The logs panel on the overview dashboard shows the errors.

      - uid: appointments-slow-requests
        title: Requests slower than 1 second (p95)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                histogram_quantile(0.95, sum by (le) (rate(http_server_requests_milliseconds_bucket{service_name="appointments",uri!~"/actuator.*"}[10m])))
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 1000 ] } } ] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: The 95th percentile response time is over 1 second. Check database connection waits and lock waits.

      # --- USE: queues and resources ------------------------------------------------------------------------------------
      - uid: appointments-outbox-stuck
        title: Events waiting for a listener over 10 minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'max(modulith_events_incomplete_oldest_age_seconds{service_name="appointments"})' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 600 ] } } ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: >-
            An event in public.event_publication has had no completed listener for over 10 minutes: a listener keeps
            failing. Failed ones are retried every 5 minutes up to 12 attempts, then stay FAILED; find them by
            listener_id and status, check the logs, fix the cause, and restart to redeliver.

      - uid: appointments-db-pool-waits
        title: Requests waiting for a database connection
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'max(max_over_time(hikaricp_connections_pending{service_name="appointments"}[5m]))' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 0 ] } } ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: The connection pool has been saturated for 5 minutes. Look for long transactions or lock waits.

      - uid: appointments-db-deadlocks
        title: Database deadlocks
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum(increase(pg_stat_database_deadlocks_total{datname="appointments"}[15m])) or vector(0)' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 5 ] } } ] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 5 deadlocks in 15 minutes. Booking retries them once; more than a few means heavy contention.

      # --- Notifications -------------------------------------------------------------------------------------------------
      - uid: appointments-notification-failures
        title: Notification sends failing above 5%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1200, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (sum(rate(notification_attempts_total{outcome!="accepted"}[15m])) or vector(0))
                / (sum(rate(notification_attempts_total[15m])) > 0)
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 0.05 ] } } ] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 5% of email or SMS attempts are refused or fail. Check the provider.

      - uid: appointments-notification-backlog
        title: Due notifications waiting over 15 minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'max(notification_due_oldest_age_seconds{service_name="appointments"})' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 900 ] } } ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: The dispatcher is not keeping up, or is not running. Reminders may go out late.

      # --- Business and identity ---------------------------------------------------------------------------------------------
      - uid: appointments-overbooked
        title: Overbooked pool days
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'max(booking_pool_days_overbooked{service_name="appointments"})' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 0 ] } } ] }
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: info }
        annotations:
          summary: >-
            A capacity reduction left pool days with more appointments than places. The branch manager should move
            appointments (GET /api/v1/admin/overbooked).

      - uid: appointments-failed-logins
        title: Many failed sign-ins
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum(increase(keycloak_user_events_total{event="login",error!=""}[5m])) or vector(0)' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 20 ] } } ] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 20 failed sign-ins in 5 minutes; possibly password guessing. Keycloak's brute-force lockout applies.

      - uid: appointments-login-deletion-failed
        title: Keycloak login deletion failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1200, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum(increase(identity_login_account_deletions_total{outcome="failed"}[15m])) or vector(0)' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [ { evaluator: { type: gt, params: [ 0 ] } } ] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: >-
            Erased customers' Keycloak logins could not be deleted. The erasure event is retried on restart; check the
            appointments-backend service account and its client secret.
