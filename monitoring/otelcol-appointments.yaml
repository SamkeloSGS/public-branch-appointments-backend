# Merged over the image's /otel-lgtm/otelcol-config.yaml (OTELCOL_EXTRA_ARGS in compose.yaml): scrapes Keycloak and
# postgres-exporter and sends their metrics down the same pipeline as the backend's OTLP metrics.
receivers:
  prometheus/appointments:
    config:
      scrape_configs:
        - job_name: keycloak
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["keycloak:9000"]
        - job_name: postgres
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter:9187"]

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus/collector, prometheus/appointments]
