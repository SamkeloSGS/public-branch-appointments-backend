# Tests run the notification dispatcher themselves, so the scheduled job never races them
appointments.notification.dispatcher-enabled=false
# Tests never call Keycloak's admin API; erasure tests check the request to LoginAccounts instead
appointments.identity.keycloak-admin.enabled=false
# No OpenTelemetry collector, Keycloak or mail server in tests: nothing is exported, and health leaves them out
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false
management.logging.export.otlp.enabled=false
management.health.keycloak.enabled=false
management.health.mail.enabled=false
# No Vault in tests: the secrets application.yml reads from Vault, with test values. The database login is unused
# (Testcontainers supplies the connection) and Redis and the mail server have no login.
spring.cloud.vault.enabled=false
VAULT_URI=http://unused:8200
database-username=unused
database-password=unused
redis-password=
smtp-username=
smtp-password=
backend-client-secret=test-backend-secret
webhook-secret-local=test-webhook-secret
# The "local" stand-in provider, as in application-local.yml
appointments.notification.webhook-secrets.local=${webhook-secret-local}
# The settings production takes from environment variables. Testcontainers supplies the database and Redis
# connections, so those two addresses are unused.
DATABASE_URL=jdbc:postgresql://unused/appointments
REDIS_HOST=unused
REDIS_SSL=false
SMTP_HOST=localhost
JWT_ISSUER_URI=http://localhost:8180/realms/appointments
FRONTEND_URL=http://localhost:4200
NOTIFICATION_EMAIL_FROM=appointments@appointments.test
OTLP_ENDPOINT=http://localhost:4318
DEPLOYMENT_ENVIRONMENT=test
# ApiDocumentationTests check the OpenAPI description and Swagger UI, off in production
API_DOCS_ENABLED=true
BRANCH_CODE=MAIN
BRANCH_NAME=Main Branch
BRANCH_STREET=1 Main Road
BRANCH_CITY=Cape Town
BRANCH_PROVINCE=Western Cape
BRANCH_POSTAL_CODE=8001
BRANCH_LATITUDE=-33.9249
BRANCH_LONGITUDE=18.4241
# Tests send many requests from one address and run the outbox maintenance themselves
appointments.identity.rate-limits.enabled=false
appointments.events.maintenance-enabled=false
